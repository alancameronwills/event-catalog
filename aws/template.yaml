AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Shared Event Poster Catalog backend — a single Lambda function (invoked via
  a Function URL, no API Gateway) backed by DynamoDB for the index and S3 for
  poster images. Everything here is pay-per-use: on-demand DynamoDB billing
  and a Lambda that only runs (and costs anything) while handling a request,
  so an idle catalog costs nothing.

Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: >
      Shared secret every client must send as the X-Api-Token header. Generate
      one with `openssl rand -hex 32` (or any long random string) — the same
      value goes into every user's browser extension.
  DuplicateThreshold:
    Type: Number
    Default: 10
    Description: Max Hamming distance (of 64) treated as a likely duplicate poster.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 1024 # sharp/tesseract are CPU-bound; more memory = more vCPU = faster cold starts.
    Environment:
      Variables:
        CAPTURES_TABLE: !Ref CapturesTable
        DATES_TABLE: !Ref DatesTable
        VENUES_TABLE: !Ref VenuesTable
        IMAGES_BUCKET: !Ref ImagesBucket
        API_TOKEN: !Ref ApiToken
        DUP_THRESHOLD: !Ref DuplicateThreshold

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: index.handler
      Description: Event Poster Catalog API — routes, auth, and the capture pipeline (hash + OCR).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CapturesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VenuesTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      FunctionUrlConfig:
        AuthType: NONE # auth is our own X-Api-Token check in code, not IAM/AWS SigV4
        Cors:
          AllowOrigins: ["*"] # every unpacked install has a different chrome-extension:// id
          AllowMethods: [GET, POST, PATCH, DELETE]
          AllowHeaders: [content-type, x-api-token]
          MaxAge: 3600

  # --- Data ------------------------------------------------------------
  #
  # PAY_PER_REQUEST (on-demand) billing on every table: cost scales with
  # actual reads/writes, zero when the catalog isn't being used.

  CapturesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: capturedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        # All captures share one partition key so a single Query returns them
        # newest-first (ScanIndexForward=false) — this also doubles as the feed
        # for duplicate-hash comparison (every capture, sorted or not).
        - IndexName: ByCapturedAt
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: capturedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  VenuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: nameLower
          AttributeType: S
      KeySchema:
        - AttributeName: nameLower
          KeyType: HASH

  # --- Images ------------------------------------------------------------
  #
  # Public-read objects (poster images are public marketing material scraped
  # from public web pages anyway — the local server never gated /images/*
  # either), so the panel can use the S3 URL directly with no signing. Object
  # keys embed a random id, and bucket listing stays blocked, so images aren't
  # enumerable. The real access control (who can read/write captures at all)
  # is the X-Api-Token check in the Lambda.

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "event-catalog-images-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadImages
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ImagesBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: Function URL — set this as the extension's API base URL.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  ImagesBucketName:
    Description: S3 bucket holding poster images (used by the migration script).
    Value: !Ref ImagesBucket
  CapturesTableName:
    Value: !Ref CapturesTable
  DatesTableName:
    Value: !Ref DatesTable
  VenuesTableName:
    Value: !Ref VenuesTable
